name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/wheels.yml", "pyproject.toml", "Cargo.toml"]

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install maturin
      - run: maturin sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels ${{ matrix.os }} ${{ matrix.cibw_archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One arch per job so the two macOS archs build in parallel instead of
        # serially on a single arm64 runner (previously the slowest job).
        include:
          - { os: ubuntu-latest, cibw_archs: x86_64 }
          - { os: ubuntu-24.04-arm, cibw_archs: aarch64 }
          - { os: macos-14, cibw_archs: arm64 }
          - { os: macos-14, cibw_archs: x86_64 }
          - { os: windows-latest, cibw_archs: AMD64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'   # Linux builds run in manylinux containers; rustup is installed there by before-all
        with:
          # macOS x86_64 wheels are cross-compiled on the arm64 runner (no Intel runners left)
          targets: ${{ matrix.cibw_archs == 'x86_64' && runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          # cibuildwheel is pointed at these dirs via CARGO_* (see pyproject.toml),
          # so compiled dependencies (pyo3 & co.) survive between runs.
          path: |
            target-cibw
            .cargo-home/registry
            .cargo-home/git
          key: cargo-${{ matrix.os }}-${{ matrix.cibw_archs }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-${{ matrix.cibw_archs }}-
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lightarray/
    permissions:
      id-token: write   # PyPI trusted publishing, no API token stored
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
